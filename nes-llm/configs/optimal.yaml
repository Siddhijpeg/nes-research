# NES Optimal Configuration
# Generated by: python -m src.cli tune
# Run benchmark: python -m src.cli benchmark

model:
  model_id: "meta-llama/Llama-3-8B"
  num_layers: 32
  hidden_dim: 4096
  quantization_format: "nf4"

embedding_strategy:
  strategy: "sign"
  alpha: 0.25           # tuned: margin parameter
  min_magnitude: 0.001

carrier_selection:
  method: "magnitude"
  percentile_threshold: 25
  use_qaci: true

qaci:
  enabled: true
  gamma: 2.5            # tuned: quality amplification
  early_layer_factor: 0.65
  middle_layer_factor: 1.00
  late_layer_factor: 0.65

crypto:
  algorithm: "aes"
  key_size: 256
  cipher_mode: "gcm"
  iv_size: 12

evaluation:
  max_ppl_degradation: 0.02
  max_accuracy_loss: 0.01
  max_kl_divergence: 0.05
  max_detector_accuracy: 0.55
  noise_tolerance_sigma: 0.002

payload:
  total_bits: 50000     # tuned: optimal capacity
  target_ber: 0.02
  target_sigma: 0.001